<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S3A1AVIK — The Last Quiet Night</title><style>
*{box-sizing:border-box}body{margin:0;background:#050b18;color:#d9f5ff;font:16px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;text-shadow:0 2px 6px #000}#panel{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:min(94vw,660px);background:#061327e8;border:1px solid #3d94ba;padding:16px;border-radius:12px;text-align:center}button{background:#0e617f;color:white;border:1px solid #80e5ff;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}h1{margin:0 0 8px;font-size:21px;letter-spacing:.09em}#dialogue{min-height:48px}#stats{font-variant-numeric:tabular-nums}small{color:#9db8c7}</style>
<canvas id="scene"></canvas><div id="hud"><div><b>S3A1AVIK // ACT I</b><div id="mission">THE LAST QUIET NIGHT</div></div><div id="stats">0 m · 0:00 · 2:10/500m</div></div><div id="panel"><h1 id="heading">THE LAST QUIET NIGHT</h1><p id="dialogue">ECHO: Coastal telemetry restored. Conditions normal.</p><button id="action">BEGIN MISSION</button><p><small>Standalone keyboard prototype · SPACE or tap ROW to advance · not connected to PM5</small></p></div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),stats=document.querySelector('#stats'),dialogue=document.querySelector('#dialogue'),heading=document.querySelector('#heading'),action=document.querySelector('#action');let width,height,dist=0,strokes=0,start=0,playing=false,ended=false,phase=0,ships=[];function resize(){width=c.width=innerWidth*devicePixelRatio;height=c.height=innerHeight*devicePixelRatio}addEventListener('resize',resize);resize();
const lines=[{at:0,msg:'ECHO: Coastal telemetry restored. Conditions normal.'},{at:100,msg:'ECHO: Correction. Those are not stars.'},{at:300,msg:'UNKNOWN: Perimeter breach. Do not let the signal reach the surface.'},{at:550,msg:'ECHO: Enemy vessels over the village. Keep moving. Evacuation corridor ahead.'},{at:850,msg:'ECHO: The ships are targeting the water, not the houses. Why?'},{at:1150,msg:'UNKNOWN: Containment failing. Seal the source.'},{at:1500,msg:'ECHO: Transmission detected beneath the sea. This was never an invasion.'}];
function row(){if(!playing||ended)return;dist+=25;strokes++;while(phase+1<lines.length&&dist>=lines[phase+1].at){phase++;dialogue.textContent=lines[phase].msg}if(dist>=1500){ended=true;playing=false;heading.textContent='MISSION COMPLETE';action.textContent='REPLAY';dialogue.textContent='ECHO: Something is waking beneath S3A1AVIK. The fleet was trying to stop it.'}}
action.onclick=()=>{if(ended){dist=0;strokes=0;phase=0;ended=false;dialogue.textContent=lines[0].msg}playing=true;start=performance.now();heading.textContent='EVACUATE THE COAST';action.textContent='ROW';};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();row()}});action.addEventListener('pointerdown',()=>{if(playing)row()});
function draw(t){g.fillStyle='#040916';g.fillRect(0,0,width,height);let w=width,h=height;let sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#060b20');sky.addColorStop(.65,'#193653');sky.addColorStop(1,'#08152c');g.fillStyle=sky;g.fillRect(0,0,w,h);
g.fillStyle='#0c1c31';g.beginPath();g.moveTo(0,h*.58);for(let x=0;x<=w;x+=w/15){let y=h*(.32+.16*Math.abs(Math.sin(x/w*10+1)));g.lineTo(x,y)}g.lineTo(w,h*.7);g.lineTo(0,h*.7);g.fill();
let offset=dist*.12;for(let i=0;i<18;i++){let x=((i*173-offset)%(w+180)+(w+180))%(w+180)-90,y=h*(.59+.06*Math.sin(i*3));g.fillStyle='#142c40';g.fillRect(x,y,65,h*.13);g.fillStyle='#6cdfff';for(let j=0;j<3;j++)g.fillRect(x+10+j*17,y+12,7,11)}
g.fillStyle='#061b31';g.fillRect(0,h*.72,w,h*.28);for(let i=0;i<13;i++){let y=h*(.75+i*.02);g.strokeStyle='rgba(52,171,211,.12)';g.beginPath();g.moveTo(0,y+Math.sin(t*.001+i)*3);g.lineTo(w,y);g.stroke()}
let invasion=Math.min(1,dist/450);for(let i=0;i<5;i++){let x=w*(.1+i*.19)+Math.sin(t*.0004+i)*w*.025,y=h*(.17+(i%3)*.07);g.fillStyle='rgba(242,68,85,'+invasion+')';g.beginPath();g.moveTo(x-35,y);g.lineTo(x,y-13);g.lineTo(x+35,y);g.lineTo(x,y+9);g.fill()}
let cx=w*.5,cy=h*.68;g.fillStyle='#102e49';g.beginPath();g.moveTo(cx,cy-80);g.lineTo(cx+75,cy+60);g.lineTo(cx,cy+25);g.lineTo(cx-75,cy+60);g.closePath();g.fill();g.strokeStyle='#52d7ff';g.lineWidth=3;g.stroke();g.fillStyle='#55cfff';g.fillRect(cx-22,cy+25,44,8);
let elapsed=playing?(performance.now()-start)/1000:0;stats.textContent=Math.round(dist)+' m · '+Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0')+' · DEMO';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
